basePath: /
definitions:
  PishingSimulator_SecurityProject_internal_models.Record:
    properties:
      created_at:
        type: string
      file_path:
        type: string
      id:
        type: integer
      scenario:
        type: string
      user_id:
        type: integer
    type: object
  PishingSimulator_SecurityProject_internal_models.UserProfile:
    properties:
      age:
        type: integer
      gender:
        type: string
      name:
        type: string
    type: object
  internal_handler.ErrorResponse:
    properties:
      error:
        example: 에러 원인 및 설명
        type: string
    type: object
  internal_handler.HistoryResponse:
    properties:
      history:
        items:
          $ref: '#/definitions/PishingSimulator_SecurityProject_internal_models.Record'
        type: array
    type: object
  internal_handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: my_user
        type: string
    type: object
  internal_handler.LoginSuccessResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  internal_handler.SignupRequest:
    properties:
      password:
        example: password123
        type: string
      profile:
        $ref: '#/definitions/PishingSimulator_SecurityProject_internal_models.UserProfile'
      username:
        example: new_user
        type: string
    type: object
  internal_handler.SuccessResponse:
    properties:
      message:
        example: User created successfully
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Phising Simulator API
  version: "0.1"
paths:
  /api/history:
    get:
      description: 사용자의 과거 시뮬레이션(통화/채팅) 기록 목록을 최신순으로 반환합니다.
      produces:
      - application/json
      responses:
        "200":
          description: 'history: [기록 배열]'
          schema:
            $ref: '#/definitions/internal_handler.HistoryResponse'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: DB 조회 실패 등 서버 오류
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 사용자 통화 기록 조회
      tags:
      - API (Protected)
  /api/history/audio/{filename}:
    get:
      description: |-
        특정 통화 기록의 오디오 파일(.mp3)을 재생합니다.
        <br> **[인증]** Header에 `Authorization: Bearer ...`를 넣거나, URL 파라미터 `?token=...`을 사용하세요.
      parameters:
      - description: '오디오 파일명 (예: session_uuid.mp3)'
        in: path
        name: filename
        required: true
        type: string
      - description: JWT 토큰 (Header 사용 불가 시)
        in: query
        name: token
        type: string
      produces:
      - audio/mpeg
      responses:
        "200":
          description: 오디오 바이너리 데이터
          schema:
            type: file
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: 해당 파일을 찾을 수 없음
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 녹음된 오디오 파일 스트리밍
      tags:
      - API (Protected)
  /api/profile:
    get:
      description: 인증된 사용자의 프로필 정보를 조회합니다. (JWT 필요)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              ' username':
                type: string
              message:
                type: string
            type: object
        "401":
          description: 인증 토큰 누락 또는 만료
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 프로필 조회 (Profile)
      tags:
      - API (Protected)
  /login:
    post:
      consumes:
      - application/json
      description: 사용자 로그인을 처리합니다.
      parameters:
      - description: 로그인 요청 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.LoginSuccessResponse'
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: 인증 실패 (자격 증명 오류)
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: 서버 내부 오류
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - AccessCodeAuth: []
      summary: 로그인
      tags:
      - Auth
  /signup:
    post:
      consumes:
      - application/json
      description: 새로운 사용자 계정을 생성합니다.
      parameters:
      - description: 회원가입 요청 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.SignupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - AccessCodeAuth: []
      summary: 회원가입 (Signup)
      tags:
      - Auth
  /ws/simulation:
    get:
      description: |-
        웹소켓 연결을 수립합니다. 별도의 핸드쉐이크 인증은 없습니다.
        <br>
        **[중요]** 연결 수립 후 **5초 이내**에 반드시 인증(Init) 메시지를 보내야 합니다.
        <pre><code>{
        "type": "init",
        "token": "eyJhbGciOiJIUz...",
        "scenario": "...",
        "mode": "..."
        }</code></pre>
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Invalid Init Message
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid Token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 보이스피싱 시뮬레이션 시작 (WebSocket)
      tags:
      - Simulation (WebSocket)
securityDefinitions:
  AccessCodeAuth:
    in: header
    name: Project-Secure
    type: apiKey
  BearerAuth:
    description: Bearer 토큰 형식, Bearer {token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
